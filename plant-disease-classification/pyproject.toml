[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plantvillage"
version = "1.0.0"
description = "Plant disease classification on PlantVillage: exploration, classical baselines, CNN and transfer learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pillow>=10.0",
    "tensorflow>=2.15",
    "kaggle>=1.6",
]

[project.optional-dependencies]
tuning = ["keras-tuner>=1.4"]
explain = ["shap>=0.44"]
stats = ["scipy>=1.11", "statsmodels>=0.14"]
dev = ["pytest>=7.4", "ruff>=0.4", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
