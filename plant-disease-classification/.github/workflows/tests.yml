name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The tested modules (split, metrics) deliberately avoid TensorFlow,
      # so CI stays fast and does not need a GPU or the dataset.
      - name: Install
        run: pip install numpy pandas scikit-learn pytest ruff
      - name: Lint
        run: ruff check src scripts tests
      - name: Test
        run: pytest -q
        env:
          PYTHONPATH: src
